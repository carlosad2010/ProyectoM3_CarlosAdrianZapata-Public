<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- LOOK SPIDER (opcional): para volver al diseño anterior borra este comentario y las 2 líneas siguientes -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" />
    <link rel="stylesheet" href="/look-spider.css" />
    <title>Chatea con Spider-Man</title>
    <!-- Aplica el tema antes de pintar, para que no "parpadee" en claro.
         Usa el guardado o, si no hay, el del sistema operativo -->
    <script>
      try {
        const saved = localStorage.getItem("theme");
        const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved || (prefersDark ? "dark" : "light");
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <nav class="app-nav" aria-label="Navegación principal">
      <div class="app-nav__inner">
        <a
          href="/home"
          class="app-nav__brand"
          data-link
          aria-label="Ir a la página de inicio"
        >
          <span class="app-nav__logo" aria-hidden="true"><img src="/assets/spider-emblem.svg" alt="" /></span>
          <span class="app-nav__brand-text">SpiderChat</span>
        </a>
        <div class="app-nav__links">
          <a href="/home" class="app-nav__link" data-link>Home</a>
          <a href="/chat" class="app-nav__link" data-link>Chat</a>
          <a href="/about" class="app-nav__link" data-link>About</a>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Activar modo oscuro"
          >
            <svg class="theme-toggle__moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
            <svg class="theme-toggle__sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          </button>
        </div>
      </div>
    </nav>
    <main id="view" class="app"></main>
    <footer class="app-footer">
      <small>Prueba de concepto · ComicSansCon</small>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
